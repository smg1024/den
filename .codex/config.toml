[tui]
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "current-dir",
  "git-branch",
]

[features]
multi_agent        = true
prevent_idle_sleep = true

[agents]
max_threads = 6
max_depth   = 1

[sandbox_workspace_write]
network_access = true

[mcp_servers.mcp-nixos]
command = "uvx"
args    = ["mcp-nixos"]
